name: Bug report
description: Report something that does not work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The file tree and config that produce the problem, or a link to a minimal repository.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: next-pathmap version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: next-version
    attributes:
      label: Next.js version
      placeholder: 13.4.4
  - type: input
    id: node-version
    attributes:
      label: Node.js version and OS
      placeholder: Node.js 18.16.0 on macOS 13.4
    validations:
      required: true
